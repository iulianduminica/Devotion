name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    # The Node 25 canary may fail without failing the branch: it exists to give
    # notice, not to block. node:sqlite is still marked experimental.
    continue-on-error: ${{ matrix.canary == true }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["24"]
        include:
          - os: ubuntu-latest
            node: "25"
            canary: true

    steps:
      - uses: actions/checkout@v4

      - name: Require Node 24+
        run: node -e "const m=+process.versions.node.split('.')[0]; if (m < 24) { console.error('node:sqlite needs Node 24+, got ' + process.versions.node); process.exit(1) }"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build the web app
        run: npm run build

      - name: Suites
        run: npm run test:all

      - name: Boot the real server over HTTP
        run: npm run boot:check

      - name: Seed the demo workspace
        run: npm run seed

      - name: Boot against the seeded workspace
        run: node scripts/boot-check.mjs --port 8126 --workspace .data/workspace --min-nodes 40

      - name: Upload the bundle
        if: matrix.canary != true
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist
          retention-days: 7
